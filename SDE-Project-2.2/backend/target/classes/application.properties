# ===============================
# Project Name
# ===============================
spring.application.name=Book-Library-SDE-Project

# ===============================
# H2 DATABASE (PERSISTENT FILE MODE)
# ===============================
# Stores the database in /data/librarydb.mv.db
spring.datasource.url=jdbc:h2:file:./data/librarydb
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Fix for H2 + Hibernate compatibility
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# ===============================
# SERVER PORT
# Backend runs on 8081 (frontend on 5173)
# ===============================
server.port=8081

# ===============================
# HIBERNATE / JPA SETTINGS
# ===============================
# update = keeps your data and updates schema as needed
spring.jpa.hibernate.ddl-auto=update

# Shows SQL queries in console
spring.jpa.show-sql=true

# Format the printed SQL nicely
spring.jpa.properties.hibernate.format_sql=true

# Ensures data.sql loads AFTER Hibernate creates tables
spring.jpa.defer-datasource-initialization=true

spring.sql.init.mode=always


# ===============================
# H2 WEB CONSOLE
# ===============================
spring.h2.console.enabled=true
spring.h2.console.path=/h2
